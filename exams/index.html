<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Pocholo</title>
    <link rel="icon" type="image/x-icon" href="./nico.webp">
    <link rel="stylesheet" href="styles.css?v=3">
</head>

<body>
    <main>
        <div id="questions-container"></div>
        <section id="print-answers" aria-label="Answer key">
            <h1>Answers</h1>
            <table id="print-answers-table">
                <thead>
                    <tr>
                        <th>Q</th><th>Answer</th>
                        <th>Q</th><th>Answer</th>
                        <th>Q</th><th>Answer</th>
                        <th>Q</th><th>Answer</th>
                        <th>Q</th><th>Answer</th>
                    </tr>
                </thead>
                <tbody id="print-answers-list"></tbody>
            </table>
        </section>

        <section id="quiz-controls" aria-label="Quiz controls">
            <div id="score-panel">
                <div id="score-display"></div>
                <button id="check-answers-button" onclick="checkAnswers()" hidden>Check all answers</button>
                <button id="print-page-button" type="button" onclick="window.print()">Print</button>
            </div>

            <div id="generator-container">
            <div><input type="text" name="seed" id="generator-seed" value="0"/><label for="generator-seed">Seed (Si generas preguntas al azar con la misma seed siempre te saldrán las mismas)</label></div>
            <div><input type="number" id="generator-questions" value="5" min="0"/><label for="generator-questions">Number of questions (A generar de la lista de preguntas mezclada usando la seed)</label></div>
            <div><input type="number" id="generator-q-start" value="0" min="0"/><label for="generator-q-start">Start from question (Si quieres hacerte todas las preguntas que existen: usa la misma seed y apúntate desde qué pregunta retomar si te vas a tomar un descanso)</label></div>
            <div id="generator-actions">
                <input type="button" id="generator-button" value="Generate more" onclick="generateQuestions()"/>
                <input type="button" id="generator-exam-button" value="Generate 85-question exam" onclick="generateExam()"/>
            </div>
            </div>
        </section>
    </main>
</body>

<script>
    function splitmix32(a) {
        return function() {
        a |= 0;
        a = a + 0x9e3779b9 | 0;
        let t = a ^ a >>> 16;
        t = Math.imul(t, 0x21f0aaad);
        t = t ^ t >>> 15;
        t = Math.imul(t, 0x735a2d97);
        return ((t = t ^ t >>> 15) >>> 0) / 4294967296;
        }
    }

    function seedToNumber(seed) {
        const numericSeed = Number(seed);
        if (Number.isFinite(numericSeed)) {
            return numericSeed;
        }

        let hash = 2166136261;
        for (let i = 0; i < seed.length; i++) {
            hash = Math.imul(hash ^ seed.charCodeAt(i), 16777619);
        }
        return hash >>> 0;
    }

    function shuffleArray(array, randomGen) {
        for (let i = array.length - 1; i > 0; i--) {
            // Pick a random index from 0 to i
            const j = Math.floor(randomGen() * (i + 1));
            // Swap array[i] and array[j]
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function appendQuestions(questions) {
        const firstSequenceNumber = document.querySelectorAll("#questions-container .question").length + 1;
        for (let i = 0; i < questions.length; i++) {
            const question = questions[i];
            const sequenceNumber = firstSequenceNumber + i;
            const questionElement = document.createElement("div");
            questionElement.className = "question";
            
            questionElement.innerHTML = `
                <fieldset data-correct_answer="${question.correct_answer}">
                <legend>(${sequenceNumber}) ${question.id}</legend>
                <div class="question-block">${question.q_text}</div>
                ${['a', 'b', 'c', 'd'].map(option => `<label class="answer-option" for="${question.id}-${option}"><input type="radio" id="${question.id}-${option}" name="answers-${question.id}" value="${option}"><span>${question['answer_' + option]}</span></label>`).join('\n')}
                </fieldset>
            `;
            
            document.getElementById("questions-container").appendChild(questionElement);

            const answerTableBody = document.getElementById("print-answers-list");
            const rowIndex = Math.floor((sequenceNumber - 1) / 5);
            let answerRow = answerTableBody.rows[rowIndex];
            if (!answerRow) {
                answerRow = answerTableBody.insertRow();
                for (let cellIndex = 0; cellIndex < 10; cellIndex++) {
                    answerRow.insertCell();
                }
            }

            const pairIndex = (sequenceNumber - 1) % 5;
            answerRow.cells[pairIndex * 2].textContent = sequenceNumber;
            const correctAnswer = question.correct_answer;
            answerRow.cells[pairIndex * 2 + 1].textContent =
                correctAnswer && correctAnswer !== "null" ? correctAnswer.toUpperCase() : "—";
        }
    }

    async function loadRandomQuestions(n, seed, q_start) {
        try {
            // Random timestamp so it doesn't cache it
            const response = await fetch(`./questions.json?v=3`);

            const allQuestions = await response.json();

            // Shuffle and slice
            const randomGen = splitmix32(seed);
            let randomQuestions = shuffleArray(allQuestions, randomGen);

            randomQuestions = randomQuestions.slice(q_start, q_start + n);
            randomQuestions.sort((a, b) => a.id > b.id);

            appendQuestions(randomQuestions);
            
        } catch (e) {
            console.error("Could not fetch questions", e);
        }
    }

    function checkAnswers() {
        var correct_n = 0;
        document.querySelectorAll("fieldset").forEach(fieldset => {
            const correct_answer = fieldset.dataset.correct_answer;
            const selected_div = fieldset.querySelector('input:checked')?.closest('.answer-option');
            
            // Reset
            fieldset.classList.remove("correct", "incorrect", "unselected");

            // If no selected answer
            if (selected_div == null) {
                fieldset.classList.add("unselected");
            }
            else {
                // If no correct answer
                if (correct_answer == "null") {
                    fieldset.classList.add("impugnada")
                }
                else {
                    const selected_answer = selected_div.querySelector("input").value;

                    // Mark the correct answer
                    fieldset.querySelectorAll(".answer-option").forEach(answerNode => {
                        // Reset
                        answerNode.classList.remove("correct", "incorrect");
                        
                        // Check
                        const current_answer = answerNode.querySelector("input").value;
                        if (current_answer == correct_answer) {
                            answerNode.classList.add("correct");
                        }
                    });

                    // If the selected is incorrect mark it as such
                    if (selected_answer !== correct_answer) {
                        selected_div.classList.add("incorrect");
                        fieldset.classList.add("incorrect");
                    }

                    // Otherwise it has  already been marked as correct in the previous loop
                    else {
                        fieldset.classList.add("correct");
                        correct_n++;
                    }
                }
            }

            // Compute final score
            const total = document.querySelectorAll("fieldset:not(.impugnada)").length;
            const score = correct_n / total;

            document.querySelector("#score-display").innerHTML = `
                <b>Correct answers: ${correct_n} / ${total} ~ (${Math.round(score*10 * 100) / 100} / 10)</b>
            `

        });
    }

    function generateQuestions() {
        // Get parameters
        const seed = seedToNumber(document.getElementById("generator-seed").value);
        const n_questions = Number(document.getElementById("generator-questions").value);
        const q_start = Number(document.getElementById("generator-q-start").value);

        // Generate new questions
        loadRandomQuestions(n_questions, seed, q_start);

        // Update the from question field
        document.getElementById("generator-q-start").value = q_start + n_questions

        // Unhide the check answers button
        document.getElementById("check-answers-button").hidden = false;
    }

    async function generateExam() {
        const seed = seedToNumber(document.getElementById("generator-seed").value);

        try {
            const response = await fetch("./questions.json?v=2");
            const allQuestions = await response.json();
            const randomGen = splitmix32(seed);
            const part1Numbers = Array.from({ length: 60 }, (_, index) => index + 1);

            const part2Numbers = Array.from({ length: 20 }, (_, index) => index + 61);

            const part3Numbers = [81, 82, 83];
            const part4Numbers = [84, 85];

            const parts = [part1Numbers, part2Numbers, part3Numbers, part4Numbers];
            const examQuestions = []

            parts.map(part => {
                const candidates = allQuestions.filter(q => part.includes(q.q_number));
                examQuestions.push(...shuffleArray(candidates, randomGen).slice(0, part.length));
            });

            appendQuestions(examQuestions);
            document.getElementById("check-answers-button").hidden = false;
        } catch (e) {
            console.error("Could not generate exam questions", e);
        }
    }

    function fillSeed() {
        document.getElementById("generator-seed").value = `${(Math.random()*2**32)>>>0}`;
    }
    // Fill seed input with a random number
    document.addEventListener("DOMContentLoaded", fillSeed);
</script>
